name: Deploy Docs

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BoxLang + bx-sites
        uses: ortus-boxlang/setup-boxlang@1.5.0
        with:
          version: latest
          modules: bx-sites

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Lint docs
        run: bxSites lint

      - name: Build site
        run: bxSites build

      - name: Audit built site
        run: bxSites audit

      - name: Deploy to GitHub Pages
        run: bxSites gh-deploy --message=deploy-from-${{ github.ref_name }}-${{ github.sha }}
